[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apb-ml-verification"
version = "0.1.0"
description = "ML-assisted analysis of AMBA APB waveform traces"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "joblib>=1.2",
  "numpy>=1.23,<2.0",
  "pandas>=1.5,<2.1",
  "scikit-learn>=1.2,<1.4",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]